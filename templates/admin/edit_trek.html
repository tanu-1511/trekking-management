{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h3 class="text-center">Edit Trek</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ trek.name }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input
                    type="text"
                    name="location"
                    class="form-control"
                    value="{{ trek.location }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Difficulty</label>

                <select
                    name="difficulty"
                    class="form-select"
                    required>

                    <option
                        value="Easy"
                        {% if trek.difficulty == "Easy" %}selected{% endif %}>
                        Easy
                    </option>

                    <option
                        value="Medium"
                        {% if trek.difficulty == "Medium" %}selected{% endif %}>
                        Medium
                    </option>

                    <option
                        value="Hard"
                        {% if trek.difficulty == "Hard" %}selected{% endif %}>
                        Hard
                    </option>

                </select>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Start Date
                    </label>

                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        value="{{ trek.start_date }}"
                        required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        End Date
                    </label>

                    <input
                        type="date"
                        name="end_date"
                        class="form-control"
                        value="{{ trek.end_date }}"
                        required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Available Slots
                </label>

                <input
                    type="number"
                    name="available_slots"
                    class="form-control"
                    value="{{ trek.available_slots }}"
                    min="1"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Status
                </label>

                <select
                    name="status"
                    class="form-select"
                    required>

                    <option
                        value="Open"
                        {% if trek.status == "Open" %}selected{% endif %}>
                        Open
                    </option>

                    <option
                        value="Closed"
                        {% if trek.status == "Closed" %}selected{% endif %}>
                        Closed
                    </option>

                    <option
                        value="Completed"
                        {% if trek.status == "Completed" %}selected{% endif %}>
                        Completed
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4">{{ trek.description or "" }}</textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Assign Staff
                </label>

                <select
                    name="assigned_staff_id"
                    class="form-select">

                    <option value="">
                        -- No Staff Assigned --
                    </option>

                    {% for staff in staff_members %}

                        <option
                            value="{{ staff.id }}"
                            {% if trek.assigned_staff_id == staff.id %}
                                selected
                            {% endif %}>

                            {{ staff.name }} - {{ staff.email }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
