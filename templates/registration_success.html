{% extends "base.html" %}

{% block title %}
Registration Successful
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow text-center">

            <div class="card-body p-5">

                <h2 class="text-success mb-3">
                    Registration Successful!
                </h2>

                <p class="lead">
                    {{ message }}
                </p>

                <a href="{{ url_for('auth.login') }}" class="btn btn-success">
                    Go to Login
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
