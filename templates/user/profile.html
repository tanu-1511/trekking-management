{% extends "base.html" %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h3 class="text-center">
            My Profile
        </h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ user.name }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ user.email }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ user.phone }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
